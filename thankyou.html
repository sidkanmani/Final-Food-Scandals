<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spilled — Food Scandals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="simple.css">
  <style>
    .thankyou-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      max-width: 480px;
      width: 100%;
      padding: 2rem 2.2rem 2.4rem;
      box-shadow: 4px 6px 20px var(--shadow);
      position: relative;
      text-align: center;
      background-image:
        repeating-linear-gradient(
          transparent,
          transparent 27px,
          #e8e0d0 27px,
          #e8e0d0 28px
        );
    }

    /* red margin line */
    .thankyou-card::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      left: 52px;
      width: 1px;
      background: #e08080;
      opacity: 0.4;
      pointer-events: none;
    }

    .thankyou-card-header {
      background: var(--rust);
      color: #fff;
      font-family: 'Special Elite', cursive;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 8px 14px;
      margin: -2rem -2.2rem 1.8rem;
      border-radius: 3px 3px 0 0;
    }

    .thankyou-emoji {
      font-size: 2.8rem;
      margin-bottom: 0.8rem;
      position: relative;
      z-index: 1;
    }

    .thankyou-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      color: var(--rust);
      margin-bottom: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .thankyou-card p {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #5a4a30;
      font-style: italic;
      margin-bottom: 1.6rem;
      position: relative;
      z-index: 1;
    }

    .back-links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .back-link {
      font-family: 'Special Elite', cursive;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
    }

    .back-link.primary {
      background: var(--ink);
      color: var(--cream);
    }

    .back-link.primary:hover { background: var(--rust); }

    .back-link.secondary {
      background: transparent;
      color: var(--rust);
      border: 1px solid var(--rust);
    }

    .back-link.secondary:hover {
      background: var(--rust);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header>
    <h1><span>Food</span> Scandals</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="box.html">Box</a>
      <a href="collection.html">Collection</a>
      <a href="stir.html">Stir</a>
      <a href="spill.html">Spill</a>
    </nav>
  </header>

  <!-- ─── MAIN ─── -->
  <main>
    <div class="thankyou-card">
      <div class="thankyou-card-header">Food Scandals · Message Received</div>
      <div class="thankyou-emoji">☕</div>
      <h2>You Spilled.</h2>
      <p>Message received — I'll be in touch if the tea is hot enough.</p>
      <div class="back-links">
        <a href="index.html" class="back-link primary">← Back to Home</a>
        <a href="collection.html" class="back-link secondary">Browse the Collection</a>
      </div>
    </div>
  </main>

  <!-- ─── FOOTER ─── -->
  <footer>
    <p>Website made by comedian, <a href="about.html">Sidikha Ashraf</a>.</p>
  </footer>

</body>
</html>

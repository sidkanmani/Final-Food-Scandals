  <link rel="stylesheet" href="simple.css">

<body>
  <!-- ─── HEADER ─── -->
  <header>
    <h1><span>Food</span> Scandals</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="box.html">Box</a>
      <a href="collection.html">Collection</a>
      <a href="stir.html">Stir</a>

  <main>
    <div class="home-intro">
      <h2>The Debacle Box</h2>
      <p>Peruse profiles of delicious foods and the drama they've endured.</p>
    </div>

    <!-- RECIPE BOX -->
    <div
      class="box-scene"
      id="boxScene"
      role="button"
      tabindex="0"
      aria-label="Open the debacle box"
      title="Click to open"
      onclick="toggleBox()"
      onkeydown="if(event.key==='Enter'||event.key===' ')toggleBox()"
    >
      <div class="recipe-box" id="recipeBox">
        <div class="box-body"></div>
        <div class="box-lid"></div>
      </div>
    </div>
    <p class="box-hint" id="boxHint">☝ Click to open the box</p>

    <!-- CARD TRAY (shown after box opens) -->
    <div class="card-tray-wrapper" id="cardTray">
      <p class="tray-label">foods · alphabetical order · click a card to read</p>
      <div class="card-tray" id="trayScroll" role="list">
        <!-- Cards injected by JS -->
      </div>
      <div class="tray-nav" aria-label="Scroll cards">
        <button class="tray-arrow" onclick="scrollTray(-1)" aria-label="Scroll left">←</button>
        <button class="tray-arrow" onclick="scrollTray(1)"  aria-label="Scroll right">→</button>
      </div>
    </div>

    <!-- EXPANDED CARD OVERLAY -->
    <div class="card-overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-labelledby="expandedTitle">
      <div class="card-expanded" id="cardExpanded">
        <div class="expanded-header">
          <span class="expanded-label">Food Scandals · Debacle File</span>
          <button class="close-btn" onclick="closeCard()" aria-label="Close card">✕</button>
        </div>
        <div class="expanded-body" id="expandedBody">
          <!-- filled by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- ─── FOOTER ─── -->
  <footer>
    <p>Website made by comedian, <a href="about.html">Sidikha Ashraf</a>.</p>
  </footer>

        }]},
    ];

    // ── RENDER CARDS ──────────────────────────────────────
    const tray = document.getElementById('trayScroll');

    foods.forEach((food, i) => {
      const card = document.createElement('div');
      card.className = 'index-card';
      card.setAttribute('role', 'listitem');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `${food.name} — click to read`);
      card.innerHTML = `
        <div class="card-header">Food Scandals &nbsp;·&nbsp; Card ${String(i+1).padStart(2,'0')}</div>
        <div class="card-title">${food.name}</div>
        <div class="card-subtitle">${food.category}</div>
        <div class="card-tap-hint">tap to read ↗</div>
      `;
      card.addEventListener('click', () => openCard(i));
      card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') openCard(i); });
      tray.appendChild(card);
    });

    // ── BOX TOGGLE ────────────────────────────────────────
    function toggleBox() {
      const scene = document.getElementById('boxScene');
      const trayWrapper = document.getElementById('cardTray');
      const isOpen = scene.classList.toggle('open');
      trayWrapper.classList.toggle('visible', isOpen);
      scene.setAttribute('aria-label', isOpen ? 'Close the debacle box' : 'Open the debacle box');
      document.getElementById('boxHint').textContent = isOpen ? '☝ Click to close the box' : '☝ Click to open the box';
    }

    // ── TRAY ARROWS ───────────────────────────────────────
    function scrollTray(dir) {
      const t = document.getElementById('trayScroll');
      t.scrollBy({ left: dir * 290, behavior: 'smooth' });
    }

    // ── OPEN / CLOSE CARD ─────────────────────────────────
    function openCard(i) {
      const food = foods[i];
      const body = document.getElementById('expandedBody');

      const scandalsHtml = food.scandals.map(s => `
        <div class="scandal-item">
          <p>${s.text || ''}</p>
          <a href="${s.linkUrl}" target="_blank" rel="noopener noreferrer">${s.linkText}</a>
        </div>
      `).join('');

      body.innerHTML = `
        <div class="expanded-title" id="expandedTitle">${food.name}</div>
        <p class="expanded-desc">${food.desc}</p>
        <div class="expanded-scandals-label">☞ The Debacles</div>
        ${scandalsHtml}
      `;

      const overlay = document.getElementById('cardOverlay');
      overlay.classList.add('active');
      overlay.querySelector('.close-btn').focus();
    }

    function closeCard() {
      document.getElementById('cardOverlay').classList.remove('active');
    }

    document.getElementById('cardOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeCard();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCard();
    });
  </script>
</body>
</html>
